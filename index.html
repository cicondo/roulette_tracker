<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Roulette Tracker">
<meta name="theme-color" content="#0b1118">
<link rel="manifest" href="./manifest.webmanifest">
<title>Roulette Tracker V2</title>
<style>
:root{--bg:#0b1118;--panel:#111923;--card:#151f2a;--border:#2a3948;--text:#f5f7fa;--muted:#9fb0c1;--blue:#2490ff;--green:#2edb78;--red:#d93434;--yellow:#e5b72d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:6px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:6px}.row{display:flex;gap:6px;align-items:center}.grow{flex:1}.btn,.sel{min-height:39px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;padding:0 9px}.btn:active,.nbtn:active,.key:active,.modebar button:active{transform:scale(.97)}.btn.blue{background:var(--blue);border-color:var(--blue)}.btn.green{background:#16a34a;border-color:#16a34a}.btn.red{background:#8f2525;border-color:#8f2525}.btn.ghost{background:transparent}.title{font-size:20px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.mono{font-variant-numeric:tabular-nums}.modebar{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.modebar button{min-height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:800}.modebar button.active{background:#253244;border-color:#57708a}.status{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:5px}.stat{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:5px}.stat b{display:block;font-size:15px}.sectors{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sector{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center}.sector .num{font-size:38px;font-weight:900;line-height:1}.sector.primary .num{color:#ff6b67}.score{font-size:11px;color:var(--muted);margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}.feedback{font-size:15px;font-weight:800;margin-top:6px}.positive{color:var(--green)}.negative{color:#ff6363}.warn{color:var(--yellow)}.openbet{border:2px solid var(--yellow);background:#2a2415;border-radius:10px;padding:8px;margin-top:6px}.openbet b{font-size:20px}.hidden{display:none!important}.history{display:flex;gap:4px;overflow-x:auto}.ball{flex:0 0 auto;width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:800}.ball.latest{outline:2px solid var(--blue)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.nbtn{min-height:40px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:800}.liveDisplay{background:#090d12;border:1px solid var(--border);border-radius:10px;text-align:center;padding:6px;margin-bottom:6px;min-height:52px}.pending{font-size:27px;font-weight:900}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{min-height:56px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:22px;font-weight:900}.key.utility{font-size:13px}.footer{display:flex;justify-content:space-between}.storage{font-size:10px;color:var(--muted)}@media(max-width:520px){.history .ball:nth-child(n+13){display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="row">
      <select id="tableSel" class="sel grow"><option value="0">Tisch 1</option><option value="1">Tisch 2</option><option value="2">Tisch 3</option></select>
      <button id="undoBtn" class="btn ghost">Undo</button>
      <button id="resetBtn" class="btn red">Reset</button>
    </div>
    <div class="row" style="margin-top:6px;justify-content:space-between"><div id="tableTitle" class="title">TISCH 1</div><div id="coupCount" class="small muted mono">0 Coups</div></div>
    <div class="row" style="justify-content:space-between;margin-top:2px"><div id="storageText" class="storage">Speicher: dauerhaft</div><span id="sessionInfo" class="tiny muted"></span></div>
    <div class="modebar"><button id="initBtn" class="active">INIT</button><button id="liveBtn">LIVE</button></div>
  </div>

  <div class="panel status">
    <div class="stat"><span class="small muted">Status</span><b id="statusText">ERFASSEN</b></div>
    <div class="stat"><span class="small muted">Bets</span><b id="betsText">0</b></div>
    <div class="stat"><span class="small muted">P/L</span><b id="plText">0 U</b></div>
  </div>

  <div class="panel">
    <div class="sectors">
      <div class="sector primary"><div class="small muted">SEKTOR A</div><div id="aNum" class="num">—</div><div id="aScore" class="score">—</div></div>
      <div class="sector"><div class="small muted">SEKTOR B</div><div id="bNum" class="num">—</div><div id="bScore" class="score">—</div></div>
    </div>
    <div id="betActions" class="actions"><button id="betABtn" class="btn green">A SETZEN</button><button id="betABBtn" class="btn blue">A+B</button><button id="skipBtn" class="btn ghost">SKIP</button></div>
    <div id="openBet" class="openbet hidden"><div class="small muted">OFFENE WETTE</div><b id="openBetText"></b><div class="small warn">Nächster Coup entscheidet</div></div>
    <div id="feedback" class="feedback">Noch kein Bet aktiv.</div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:5px"><div class="small muted">Letzte Treffer</div><div class="small muted"><span id="hitsText">0 Hits</span> · <span id="rateText">0%</span></div></div>
    <div id="history" class="history"></div>
  </div>

  <div id="initPanel" class="panel"><div class="row" style="justify-content:space-between;margin-bottom:5px"><b>Initiale Zahleneingabe</b><span class="tiny muted">0–36 neutral</span></div><div id="numGrid" class="grid"></div></div>

  <div id="livePanel" class="panel hidden">
    <div class="row" style="justify-content:space-between;margin-bottom:5px"><b>Live-Eingabe</b><span class="tiny muted">1–2 Taps</span></div>
    <div class="liveDisplay"><div id="pendingDisplay" class="pending">—</div><div id="pendingHint" class="tiny muted">Nächste Zahl</div></div>
    <div class="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button id="clearPendingBtn" class="key utility">⌫</button><button class="key" data-k="0">0</button><button id="pauseBtn" class="key utility">PAUSE</button>
    </div>
  </div>

  <div class="panel footer"><button id="newSessionBtn" class="btn ghost">Neue Session</button><button id="exportBtn" class="btn ghost">Export JSON</button></div>
</div>
<script>
(() => {
'use strict';
const wheel=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
const KEY='rouletteTrackerV2';
const $=id=>document.getElementById(id);
const el={tableSel:$('tableSel'),undoBtn:$('undoBtn'),resetBtn:$('resetBtn'),tableTitle:$('tableTitle'),coupCount:$('coupCount'),storageText:$('storageText'),sessionInfo:$('sessionInfo'),initBtn:$('initBtn'),liveBtn:$('liveBtn'),statusText:$('statusText'),betsText:$('betsText'),plText:$('plText'),aNum:$('aNum'),bNum:$('bNum'),aScore:$('aScore'),bScore:$('bScore'),betActions:$('betActions'),betABtn:$('betABtn'),betABBtn:$('betABBtn'),skipBtn:$('skipBtn'),openBet:$('openBet'),openBetText:$('openBetText'),feedback:$('feedback'),hitsText:$('hitsText'),rateText:$('rateText'),history:$('history'),initPanel:$('initPanel'),livePanel:$('livePanel'),numGrid:$('numGrid'),pendingDisplay:$('pendingDisplay'),pendingHint:$('pendingHint'),clearPendingBtn:$('clearPendingBtn'),pauseBtn:$('pauseBtn'),newSessionBtn:$('newSessionBtn'),exportBtn:$('exportBtn')};
let persistent=true,pending='',pendingTimer=null,paused=false;
function freshTable(i){return{name:'Tisch '+(i+1),history:[],bets:[],activeBet:null,skips:0,signals:[],mode:'init',sessionStarted:new Date().toISOString()}}
function freshState(){return{active:0,tables:[freshTable(0),freshTable(1),freshTable(2)]}}
function storageOK(){try{localStorage.setItem('__rt__','1');localStorage.removeItem('__rt__');return true}catch(e){return false}}
persistent=storageOK();let state=freshState();
if(persistent){try{state=JSON.parse(localStorage.getItem(KEY))||freshState()}catch(e){state=freshState();persistent=false}}
if(!state.tables||!Array.isArray(state.tables))state=freshState();
while(state.tables.length<3)state.tables.push(freshTable(state.tables.length));
state.tables.forEach((t,i)=>{t.name=t.name||'Tisch '+(i+1);t.history=Array.isArray(t.history)?t.history:[];t.bets=Array.isArray(t.bets)?t.bets:[];t.signals=Array.isArray(t.signals)?t.signals:[];t.mode=t.mode==='live'?'live':'init';t.skips=t.skips||0;t.sessionStarted=t.sessionStarted||new Date().toISOString();});
function save(){if(!persistent)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){persistent=false}}
function sectorAt(i){const out=[];for(let d=-3;d<=3;d++)out.push(wheel[(i+d+37)%37]);return out}
function zScore(history,sector,n){const data=history.slice(-Math.min(n,history.length)),N=data.length;if(!N)return 0;const S=new Set(sector),hits=data.filter(v=>S.has(v)).length,p=7/37,sd=Math.sqrt(N*p*(1-p));return sd?(hits-N*p)/sd:0}
function score(history,i){const sector=sectorAt(i),weights=[.7,1,1.3],wins=[15,30,60];let total=0,weight=0;wins.forEach((n,j)=>{if(Math.min(n,history.length)>=10){total+=zScore(history,sector,n)*weights[j];weight+=weights[j]}});return{center:wheel[i],sector,score:weight?total/weight:-999}}
function topTwo(history){const arr=wheel.map((_,i)=>score(history,i)).sort((a,b)=>b.score-a.score),a=arr[0];const b=arr.find(x=>x.center!==a.center&&x.sector.every(n=>!a.sector.includes(n)))||arr[1];return[a,b]}
function signalLevel(s,n){return n<15?0:s<1.2?0:s<1.8?1:s<2.4?2:s<3?3:4}
function betPL(b){return !b.resolved?0:b.hit?36-b.units:-b.units}
function stats(t){const resolved=t.bets.filter(b=>b.resolved),hits=resolved.filter(b=>b.hit).length,p=resolved.reduce((sum,b)=>sum+betPL(b),0);return{resolved,hits,p,rate:resolved.length?hits/resolved.length*100:0}}
function currentSignal(t){const s=t.signals[t.signals.length-1];return s&&!s.resolved?s:null}
function createSignal(t){if(t.history.length<15)return null;const existing=currentSignal(t);if(existing&&existing.atCoup===t.history.length)return existing;const[a,b]=topTwo(t.history),numbersAB=[...new Set([...a.sector,...b.sector])],s={id:Date.now()+Math.random(),atCoup:t.history.length,createdAt:new Date().toISOString(),aCenter:a.center,bCenter:b.center,aScore:a.score,bScore:b.score,level:signalLevel(a.score,t.history.length),numbersA:[...a.sector],numbersAB,resolved:false,result:null,hitA:null,hitAB:null,played:null,skipped:false};t.signals.push(s);return s}
function resolveSignal(t,n){const s=currentSignal(t);if(!s)return;s.result=n;s.hitA=s.numbersA.includes(n);s.hitAB=s.numbersAB.includes(n);s.resolved=true;s.resolvedAt=new Date().toISOString()}
function resolveBet(t,n){if(!t.activeBet)return;const id=t.activeBet.id,b=t.bets.find(x=>x.id===id)||t.activeBet;b.result=n;b.hit=b.numbers.includes(n);b.resolved=true;b.resolvedAt=new Date().toISOString();if(t.activeBet!==b)Object.assign(t.activeBet,b);t.activeBet=null}
function addNumber(n){if(paused||!Number.isInteger(n)||n<0||n>36)return;const t=state.tables[state.active];if(t.mode==='live'){resolveSignal(t,n);resolveBet(t,n)}t.history.push(n);if(t.mode==='live')createSignal(t);save();render()}
function createBet(type){const t=state.tables[state.active];if(t.mode!=='live'||t.activeBet||t.history.length<15)return;const[a,b]=topTwo(t.history),numbers=type==='A'?[...a.sector]:[...new Set([...a.sector,...b.sector])],sig=createSignal(t),bet={id:Date.now(),type,createdAt:new Date().toISOString(),aCenter:a.center,bCenter:type==='AB'?b.center:null,numbers,units:numbers.length,resolved:false,hit:false,result:null,signalId:sig?sig.id:null};t.bets.push(bet);t.activeBet=bet;if(sig)sig.played=type;save();render()}
function skip(){const t=state.tables[state.active];if(t.mode!=='live')return;const s=createSignal(t);t.skips++;if(s)s.skipped=true;save();render()}
function clearPendingInput(){pending='';if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null}renderPending()}
function renderPending(message){el.pendingDisplay.textContent=pending||'—';el.pendingHint.textContent=message||(pending?'zweite Ziffer oder kurz warten':'Nächste Zahl')}
function commitPending(){if(pending==='')return;const n=Number(pending);clearPendingInput();addNumber(n)}
function digit(d){if(paused)return;if(pendingTimer){clearTimeout(pendingTimer);pendingTimer=null}if(pending===''){if(d===0||d>=4){addNumber(d);return}pending=String(d);renderPending();pendingTimer=setTimeout(commitPending,650);return}const combo=Number(pending+String(d));if(combo>=10&&combo<=36){pending='';renderPending();addNumber(combo)}else{pending='';renderPending('Ungültig – neu eingeben');setTimeout(()=>renderPending(),500)}}
function setMode(mode){const t=state.tables[state.active];t.mode=mode;paused=false;clearPendingInput();if(mode==='live')createSignal(t);save();render()}
function undo(){const t=state.tables[state.active];if(t.activeBet){t.activeBet=null;const s=currentSignal(t);if(s)s.played=null;save();render();return}if(!t.history.length)return;if(t.mode==='live'){const lastSig=t.signals[t.signals.length-1];if(lastSig&&!lastSig.resolved&&lastSig.atCoup===t.history.length)t.signals.pop()}t.history.pop();if(t.mode==='live')createSignal(t);save();render()}
function render(){const t=state.tables[state.active],[a,b]=topTwo(t.history),st=stats(t),lv=signalLevel(a.score,t.history.length);el.storageText.textContent=persistent?'Speicher: dauerhaft':'Speicher: nur diese Sitzung';el.tableSel.value=String(state.active);el.tableTitle.textContent=t.name.toUpperCase();el.coupCount.textContent=t.history.length+' Coups';el.sessionInfo.textContent=new Date(t.sessionStarted).toLocaleDateString('de-DE');el.aNum.textContent=t.history.length>=15?a.center:'—';el.bNum.textContent=t.history.length>=15?b.center:'—';el.aScore.textContent=t.history.length>=15?'Score '+a.score.toFixed(1):'—';el.bScore.textContent=t.history.length>=15?'Score '+b.score.toFixed(1):'—';el.statusText.textContent=paused?'PAUSE':t.mode==='init'?'ERFASSEN':t.activeBet?'BET AKTIV':t.history.length<15?'ZU WENIG DATEN':lv>=2?'BET':lv===1?'BEOBACHTEN':'WARTEN';el.betsText.textContent=st.resolved.length;el.plText.textContent=(st.p>0?'+':'')+st.p+' U';el.plText.className=st.p>0?'positive':st.p<0?'negative':'';el.hitsText.textContent=st.hits+' Hits';el.rateText.textContent=st.rate.toFixed(1).replace('.',',')+'%';
if(t.activeBet){el.openBet.classList.remove('hidden');el.betActions.classList.add('hidden');el.openBetText.textContent=t.activeBet.type==='A'?'A · '+t.activeBet.aCenter:'A+B · '+t.activeBet.aCenter+' + '+t.activeBet.bCenter;el.feedback.textContent='Wette bestätigt.';el.feedback.className='feedback warn'}else{el.openBet.classList.add('hidden');el.betActions.classList.toggle('hidden',t.mode!=='live');const last=t.bets.filter(x=>x.resolved).slice(-1)[0];if(last){el.feedback.textContent=last.hit?'✓ HIT · '+(betPL(last)>0?'+':'')+betPL(last)+' U':'✕ MISS · '+betPL(last)+' U';el.feedback.className='feedback '+(last.hit?'positive':'negative')}else{el.feedback.textContent=t.mode==='init'?'Zahlenserie erfassen, danach LIVE wählen.':'Noch kein Bet aktiv.';el.feedback.className='feedback'}}
el.history.innerHTML='';t.history.slice(-14).reverse().forEach((n,i)=>{const e=document.createElement('span');e.className='ball'+(i===0?' latest':'');e.textContent=n;el.history.appendChild(e)});el.initPanel.classList.toggle('hidden',t.mode!=='init');el.livePanel.classList.toggle('hidden',t.mode!=='live');el.initBtn.classList.toggle('active',t.mode==='init');el.liveBtn.classList.toggle('active',t.mode==='live');el.betABtn.disabled=el.betABBtn.disabled=!!t.activeBet||t.history.length<15||t.mode!=='live';el.pauseBtn.textContent=paused?'WEITER':'PAUSE'}
for(let n=0;n<=36;n++){const b=document.createElement('button');b.className='nbtn';b.textContent=n;b.addEventListener('click',()=>addNumber(n));el.numGrid.appendChild(b)}
document.querySelectorAll('[data-k]').forEach(b=>b.addEventListener('click',()=>digit(Number(b.dataset.k))));
el.tableSel.addEventListener('change',e=>{state.active=Number(e.target.value);paused=false;clearPendingInput();save();render()});
el.undoBtn.addEventListener('click',undo);
el.resetBtn.addEventListener('click',()=>{if(confirm('Aktuellen Tisch wirklich komplett löschen?')){state.tables[state.active]=freshTable(state.active);paused=false;clearPendingInput();save();render()}});
el.betABtn.addEventListener('click',()=>createBet('A'));el.betABBtn.addEventListener('click',()=>createBet('AB'));el.skipBtn.addEventListener('click',skip);
el.initBtn.addEventListener('click',()=>setMode('init'));el.liveBtn.addEventListener('click',()=>setMode('live'));
el.clearPendingBtn.addEventListener('click',clearPendingInput);el.pauseBtn.addEventListener('click',()=>{paused=!paused;clearPendingInput();render()});
el.newSessionBtn.addEventListener('click',()=>{if(confirm('Neue Session für diesen Tisch starten? Vorher ggf. exportieren.')){state.tables[state.active]=freshTable(state.active);paused=false;clearPendingInput();save();render()}});
el.exportBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='roulette-session-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderPending();render();
})();
</script>
</body></html>
