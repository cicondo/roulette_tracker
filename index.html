<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Roulette Tracker"><meta name="theme-color" content="#0b1118"><link rel="manifest" href="./manifest.webmanifest"><title>Roulette Tracker V2</title><style>
:root{--bg:#0b1118;--panel:#111923;--card:#151f2a;--border:#2a3948;--text:#f5f7fa;--muted:#9fb0c1;--blue:#2490ff;--green:#2edb78;--red:#d93434;--yellow:#e5b72d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:6px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px;margin-bottom:6px}.row{display:flex;gap:6px;align-items:center}.grow{flex:1}.btn,.sel{min-height:39px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:700;padding:0 9px}.btn:active,.nbtn:active,.key:active{transform:scale(.97)}.btn.blue{background:var(--blue);border-color:var(--blue)}.btn.green{background:#16a34a;border-color:#16a34a}.btn.red{background:#8f2525;border-color:#8f2525}.btn.ghost{background:transparent}.title{font-size:20px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px}.mono{font-variant-numeric:tabular-nums}.modebar{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.modebar button{min-height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:800}.modebar button.active{background:#253244;border-color:#57708a}.status{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:5px}.stat{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:5px}.stat b{display:block;font-size:15px}.sectors{display:grid;grid-template-columns:1fr 1fr;gap:6px}.sector{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center}.sector .num{font-size:38px;font-weight:900;line-height:1}.sector.primary .num{color:#ff6b67}.score{font-size:11px;color:var(--muted);margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}.feedback{font-size:15px;font-weight:800;margin-top:6px}.positive{color:var(--green)}.negative{color:#ff6363}.warn{color:var(--yellow)}.openbet{border:2px solid var(--yellow);background:#2a2415;border-radius:10px;padding:8px;margin-top:6px}.openbet b{font-size:20px}.hidden{display:none!important}.history{display:flex;gap:4px;overflow-x:auto}.ball{flex:0 0 auto;width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--card);font-size:11px;font-weight:800}.ball.latest{outline:2px solid var(--blue)}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.nbtn{min-height:40px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:800}.liveDisplay{background:#090d12;border:1px solid var(--border);border-radius:10px;text-align:center;padding:6px;margin-bottom:6px;min-height:52px}.pending{font-size:27px;font-weight:900}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.key{min-height:56px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:22px;font-weight:900}.key.utility{font-size:13px}.footer{display:flex;justify-content:space-between}.storage{font-size:10px;color:var(--muted)}@media(max-width:520px){.history .ball:nth-child(n+13){display:none}}
</style></head><body><div class="wrap">
<div class="panel"><div class="row"><select id="tableSel" class="sel grow"><option value="0">Tisch 1</option><option value="1">Tisch 2</option><option value="2">Tisch 3</option></select><button id="undoBtn" class="btn ghost">Undo</button><button id="resetBtn" class="btn red">Reset</button></div><div class="row" style="margin-top:6px;justify-content:space-between"><div id="tableTitle" class="title">TISCH 1</div><div id="coupCount" class="small muted mono">0 Coups</div></div><div class="row" style="justify-content:space-between;margin-top:2px"><div id="storageText" class="storage">Speicher: dauerhaft</div><span id="sessionInfo" class="tiny muted"></span></div><div class="modebar"><button id="initBtn" class="active">INIT</button><button id="liveBtn">LIVE</button></div></div>
<div class="panel status"><div class="stat"><span class="small muted">Status</span><b id="statusText">ERFASSEN</b></div><div class="stat"><span class="small muted">Bets</span><b id="betsText">0</b></div><div class="stat"><span class="small muted">P/L</span><b id="plText">0 U</b></div></div>
<div class="panel"><div class="sectors"><div class="sector primary"><div class="small muted">SEKTOR A</div><div id="aNum" class="num">—</div><div id="aScore" class="score">—</div></div><div class="sector"><div class="small muted">SEKTOR B</div><div id="bNum" class="num">—</div><div id="bScore" class="score">—</div></div></div><div id="betActions" class="actions"><button id="betABtn" class="btn green">A SETZEN</button><button id="betABBtn" class="btn blue">A+B</button><button id="skipBtn" class="btn ghost">SKIP</button></div><div id="openBet" class="openbet hidden"><div class="small muted">OFFENE WETTE</div><b id="openBetText"></b><div class="small warn">Nächster Coup entscheidet</div></div><div id="feedback" class="feedback">Noch kein Bet aktiv.</div></div>
<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:5px"><div class="small muted">Letzte Treffer</div><div class="small muted"><span id="hitsText">0 Hits</span> · <span id="rateText">0%</span></div></div><div id="history" class="history"></div></div>
<div id="initPanel" class="panel"><div class="row" style="justify-content:space-between;margin-bottom:5px"><b>Initiale Zahleneingabe</b><span class="tiny muted">0–36 neutral</span></div><div id="numGrid" class="grid"></div></div>
<div id="livePanel" class="panel hidden"><div class="row" style="justify-content:space-between;margin-bottom:5px"><b>Live-Eingabe</b><span class="tiny muted">1–2 Taps</span></div><div class="liveDisplay"><div id="pendingDisplay" class="pending">—</div><div id="pendingHint" class="tiny muted">Nächste Zahl</div></div><div class="keypad"><button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button><button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button><button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button><button id="clearPending" class="key utility">⌫</button><button class="key" data-k="0">0</button><button id="pauseBtn" class="key utility">PAUSE</button></div></div>
<div class="panel footer"><button id="newSessionBtn" class="btn ghost">Neue Session</button><button id="exportBtn" class="btn ghost">Export JSON</button></div></div>
<script>
const wheel=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26],KEY='rouletteTrackerV2';let persistent=true,pending='',timer=null,paused=false;
function freshTable(i){return{name:'Tisch '+(i+1),history:[],bets:[],activeBet:null,skips:0,signals:[],mode:'init',sessionStarted:new Date().toISOString()}}function freshState(){return{active:0,tables:[freshTable(0),freshTable(1),freshTable(2)]}}function storageOK(){try{localStorage.setItem('__rt__','1');localStorage.removeItem('__rt__');return true}catch(e){return false}}persistent=storageOK();let state=freshState();if(persistent)try{state=JSON.parse(localStorage.getItem(KEY))||freshState()}catch(e){persistent=false}if(!state.tables)state=freshState();state.tables.forEach((t,i)=>{t.history=t.history||[];t.bets=t.bets||[];t.signals=t.signals||[];t.mode=t.mode||'init';t.skips=t.skips||0;t.name=t.name||'Tisch '+(i+1);t.sessionStarted=t.sessionStarted||new Date().toISOString()});function save(){if(!persistent)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){persistent=false}}function secAt(i){let a=[];for(let d=-3;d<=3;d++)a.push(wheel[(i+d+37)%37]);return a}function z(h,s,n){const a=h.slice(-Math.min(n,h.length)),N=a.length;if(!N)return 0;const S=new Set(s),hits=a.filter(x=>S.has(x)).length,p=7/37,sd=Math.sqrt(N*p*(1-p));return sd?(hits-N*p)/sd:0}function score(h,i){let s=secAt(i),sum=0,wt=0;[15,30,60].forEach((n,j)=>{let N=Math.min(n,h.length),w=[.7,1,1.3][j];if(N>=10){sum+=z(h,s,n)*w;wt+=w}});return{center:wheel[i],sector:s,score:wt?sum/wt:-999}}function topTwo(h){let arr=wheel.map((_,i)=>score(h,i)).sort((a,b)=>b.score-a.score),a=arr[0],b=arr.find(x=>x.center!==a.center&&x.sector.every(n=>!a.sector.includes(n)))||arr[1];return[a,b]}function level(s,n){return n<15?0:s<1.2?0:s<1.8?1:s<2.4?2:s<3?3:4}function pl(b){return !b.resolved?0:b.hit?36-b.units:-b.units}function stats(t){let r=t.bets.filter(b=>b.resolved),hits=r.filter(b=>b.hit).length,p=r.reduce((x,b)=>x+pl(b),0);return{r,hits,p,rate:r.length?hits/r.length*100:0}}function currentSignal(t){return t.signals[t.signals.length-1]||null}function resolveSignal(t,n){let s=currentSignal(t);if(!s||s.resolved)return;s.result=n;s.hitA=s.numbersA.includes(n);s.hitAB=s.numbersAB.includes(n);s.resolved=true;s.resolvedAt=new Date().toISOString()}function logSignal(t){if(t.history.length<15)return;let[a,b]=topTwo(t.history),ab=[...new Set([...a.sector,...b.sector])];t.signals.push({id:Date.now()+Math.random(),atCoup:t.history.length,createdAt:new Date().toISOString(),aCenter:a.center,bCenter:b.center,aScore:a.score,bScore:b.score,level:level(a.score,t.history.length),numbersA:[...a.sector],numbersAB:ab,resolved:false,result:null,hitA:null,hitAB:null,played:null,skipped:false})}function resolveBet(t,n){let b=t.activeBet;if(!b)return;b.result=n;b.hit=b.numbers.includes(n);b.resolved=true;b.resolvedAt=new Date().toISOString();t.activeBet=null}function addNumber(n){if(paused||n<0||n>36)return;let t=state.tables[state.active];resolveSignal(t,n);resolveBet(t,n);t.history.push(n);logSignal(t);save();render()}function createBet(type){let t=state.tables[state.active];if(t.activeBet||t.history.length<15)return;let[a,b]=topTwo(t.history),numbers=type==='A'?[...a.sector]:[...new Set([...a.sector,...b.sector])],sig=currentSignal(t),bet={id:Date.now(),type,createdAt:new Date().toISOString(),aCenter:a.center,bCenter:type==='AB'?b.center:null,numbers,units:numbers.length,resolved:false,hit:false,result:null,signalId:sig?.id||null};t.bets.push(bet);t.activeBet=bet;if(sig)sig.played=type;save();render()}function skip(){let t=state.tables[state.active],s=currentSignal(t);t.skips++;if(s)s.skipped=true;save();render()}function undo(){let t=state.tables[state.active];if(t.activeBet){t.activeBet=null;save();render();return}if(!t.history.length)return;let s=currentSignal(t);if(s&&s.atCoup===t.history.length)t.signals.pop();t.history.pop();save();render()}function setMode(m){state.tables[state.active].mode=m;clearPending();save();render()}function clearPending(){pending='';if(timer){clearTimeout(timer);timer=null}renderPending()}function renderPending(){pendingDisplay.textContent=pending||'—';pendingHint.textContent=pending?'zweite Ziffer oder kurz warten':'Nächste Zahl'}function commitPending(){if(pending==='')return;let n=+pending;clearPending();addNumber(n)}function digit(d){if(paused)return;if(timer){clearTimeout(timer);timer=null}if(pending===''){if(d===0||d>=4){addNumber(d);return}pending=''+d;renderPending();timer=setTimeout(commitPending,650);return}let first=+pending,combo=+(pending+d);pending='';renderPending();if(combo<=36){addNumber(combo);return}addNumber(first);setTimeout(()=>digit(d),80)}function render(){let t=state.tables[state.active],[a,b]=topTwo(t.history),s=stats(t),lv=level(a.score,t.history.length);storageText.textContent=persistent?'Speicher: dauerhaft':'Speicher: nur diese Sitzung';tableSel.value=state.active;tableTitle.textContent=t.name.toUpperCase();coupCount.textContent=t.history.length+' Coups';sessionInfo.textContent=new Date(t.sessionStarted).toLocaleDateString('de-DE');aNum.textContent=t.history.length>=15?a.center:'—';bNum.textContent=t.history.length>=15?b.center:'—';aScore.textContent=t.history.length>=15?'Score '+a.score.toFixed(1):'—';bScore.textContent=t.history.length>=15?'Score '+b.score.toFixed(1):'—';statusText.textContent=paused?'PAUSE':t.activeBet?'BET AKTIV':t.history.length<15?'ERFASSEN':lv>=2?'BET':lv===1?'BEOBACHTEN':'WARTEN';betsText.textContent=s.r.length;plText.textContent=(s.p>0?'+':'')+s.p+' U';plText.className=s.p>0?'positive':s.p<0?'negative':'';hitsText.textContent=s.hits+' Hits';rateText.textContent=s.rate.toFixed(1).replace('.',',')+'%';if(t.activeBet){openBet.classList.remove('hidden');betActions.classList.add('hidden');openBetText.textContent=t.activeBet.type==='A'?'A · '+t.activeBet.aCenter:'A+B · '+t.activeBet.aCenter+' + '+t.activeBet.bCenter;feedback.textContent='Wette bestätigt.';feedback.className='feedback warn'}else{openBet.classList.add('hidden');betActions.classList.remove('hidden');let last=t.bets.filter(x=>x.resolved).slice(-1)[0];if(last){feedback.textContent=last.hit?'✓ HIT · '+(pl(last)>0?'+':'')+pl(last)+' U':'✕ MISS · '+pl(last)+' U';feedback.className='feedback '+(last.hit?'positive':'negative')}else{feedback.textContent='Noch kein Bet aktiv.';feedback.className='feedback'}}history.innerHTML='';t.history.slice(-14).reverse().forEach((n,i)=>{let e=document.createElement('span');e.className='ball'+(i?'':' latest');e.textContent=n;history.appendChild(e)});initPanel.classList.toggle('hidden',t.mode!=='init');livePanel.classList.toggle('hidden',t.mode!=='live');initBtn.classList.toggle('active',t.mode==='init');liveBtn.classList.toggle('active',t.mode==='live');betABtn.disabled=betABBtn.disabled=!!t.activeBet||t.history.length<15;pauseBtn.textContent=paused?'WEITER':'PAUSE'}
for(let n=0;n<=36;n++){let b=document.createElement('button');b.className='nbtn';b.textContent=n;b.onclick=()=>addNumber(n);numGrid.appendChild(b)}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>digit(+b.dataset.k));tableSel.onchange=e=>{state.active=+e.target.value;paused=false;clearPending();save();render()};undoBtn.onclick=undo;resetBtn.onclick=()=>{if(confirm('Aktuellen Tisch wirklich komplett löschen?')){state.tables[state.active]=freshTable(state.active);paused=false;clearPending();save();render()}};betABtn.onclick=()=>createBet('A');betABBtn.onclick=()=>createBet('AB');skipBtn.onclick=skip;initBtn.onclick=()=>setMode('init');liveBtn.onclick=()=>setMode('live');clearPending.onclick=clearPending;pauseBtn.onclick=()=>{paused=!paused;clearPending();render()};newSessionBtn.onclick=()=>{if(confirm('Neue Session für diesen Tisch starten? Vorher ggf. exportieren.')){state.tables[state.active]=freshTable(state.active);paused=false;clearPending();save();render()}};exportBtn.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='roulette-session-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));renderPending();render();
</script></body></html>
